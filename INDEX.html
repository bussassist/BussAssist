<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BussAssist</title>

<style>
:root { --primary: #004AAD; }

/* BASE */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #333;
}

/* HEADER */
header {
  background: linear-gradient(135deg, var(--primary), #007BFF);
  color: white;
  padding: 60px 20px;
  text-align: center;
}

/* BUTTON */
.btn {
  background: white;
  color: var(--primary);
  padding: 14px 24px;
  border-radius: 30px;
  font-weight: bold;
  text-decoration: none;
  display: inline-block;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.08);
  box-shadow: 0 15px 35px rgba(0,74,173,0.4);
}

/* SECTION */
.section {
  padding: 30px 20px;
  text-align: center;
}

/* CARDS */
.features {
  display: grid;
  gap: 15px;
}

.card {
  padding: 20px;
  border-radius: 15px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
}

/* POPUP */
.popup {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 999;
}

/* POPUP CONTENT */
.popup-content {
  position: relative;
  margin: 5% auto;
  width: 95%;
  max-width: 700px;
  height: 90%;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(15px);
  border-radius: 15px;
  padding: 10px;
}

/* CLOSE BUTTON */
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 22px;
  cursor: pointer;
  z-index: 1000;
}

/* FORM IFRAME */
.popup-content iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 10px;
}

/* FOOTER */
footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>Never Miss a Customer Call Again</h1>
  <p>AI handles your calls, replies instantly</p>
  <a href="#" class="btn" onclick="openForm()">🚀 Get Your Service Today</a>
</header>

<div class="section">
  <h2>Features</h2>
  <div class="features">
    <div class="card">📞 Auto Call Handling</div>
    <div class="card">⚡ Instant Response</div>
    <div class="card">📱 Works on Basic Phones</div>
    <div class="card">❌ No Monthly Cost</div>
  </div>
</div>

<!-- POPUP WITH YOUR FORM -->
<div id="formPopup" class="popup">
  <div class="popup-content">
    
    <span class="close" onclick="closeForm()">✖</span>

    <iframe 
      src="https://docs.google.com/forms/d/e/1FAIpQLSdpFLZPHM28zn8uMVpOwjUKvaRcrBjRPVDUuzO0wGn2AE2RHQ/viewform?embedded=true">
    </iframe>

  </div>
</div>

<footer>
  <p>BussAssist © 2026</p>
  <div>
    <a href="https://instagram.com/bussassist_laksan">Instagram</a>
    <a href="https://youtube.com/@BussAssist_Laksan">YouTube</a>
  </div>
</footer>

<script>
function openForm() {
  document.getElementById("formPopup").style.display = "block";
}

function closeForm() {
  document.getElementById("formPopup").style.display = "none";
}

/* CLOSE ON OUTSIDE CLICK */
window.onclick = function(e) {
  const popup = document.getElementById("formPopup");
  if (e.target === popup) {
    popup.style.display = "none";
  }
}
</script>

</body>
</html>
